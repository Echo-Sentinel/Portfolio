<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="shortcut icon" href="../assets/images/icon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>
    <div class="login-container">
        <h2 class="login-title">Login</h2>
        <form id="loginForm" class="login-form">
            <input type="text" id="loginUsernameOrEmail" placeholder="Username or Email" class="form-input">
            <input type="password" id="loginPassword" placeholder="Password" class="form-input">
            <button type="submit" class="form-button">Login</button>
        </form>
        <p class="register-link">Don't have an account yet? <a href="./register.html">Register</a></p>
    </div>

    <script src="../assets/js/login.js"></script>
</body>

</html>
