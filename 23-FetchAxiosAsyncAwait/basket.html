<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <link rel="stylesheet" href="./assets/Css/basket.css" />
</head>

<body>
    <header class="basket-header">
        <h1 class="text-center my-4">Your Basket</h1>
    </header>

    <main>
        <section class="basket-section">
            <div class="container">
                <div class="row">
                    <div class="basket-items" id="basketItems">
                        <!-- Products will be dynamically inserted here -->
                    </div>

                    <div class="basket-bottom d-flex justify-content-between align-items-center mt-4">
                        <a class="btn btn-outline-primary" href="../index.html">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <h4>Total: $<span id="totalPrice">0</span></h4>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../assets/js/basket.js"></script>
</body>

</html>
