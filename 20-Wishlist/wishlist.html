<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wishlist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 80px;
    }
    .card {
      background: white;
      width: 200px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    .delete-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      position: absolute;
      top: 10px;
      left: 10px;
      color: red;
    }
  </style>
</head>
<body>
  <div class="products" id="wishlist">
    <!-- Wishlist items will be displayed here -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    const wishlistContainer = document.getElementById('wishlist');
    const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

    function removeFromWishlist(productId) {
      const productIndex = wishlist.findIndex(p => p.id === productId);

      if (productIndex !== -1) {
        const product = wishlist[productIndex];
        wishlist.splice(productIndex, 1);
        Toastify({
          text: `${product.name} removed from wishlist`,
          backgroundColor: '#e74c3c',
          duration: 3000,
          close: true,
          gravity: 'top',
          position: 'right'
        }).showToast();

        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        renderWishlist();
      }
    }

    function renderWishlist() {
      wishlistContainer.innerHTML = '';

      wishlist.forEach(product => {
        const card = document.createElement('div');
        card.classList.add('card');

        const img = document.createElement('img');
        img.src = product.img;
        img.alt = product.name;

        const name = document.createElement('h3');
        name.textContent = product.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.classList.add('delete-btn');
        deleteBtn.innerHTML = 'X';
        deleteBtn.onclick = () => removeFromWishlist(product.id);

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(deleteBtn);

        wishlistContainer.appendChild(card);
      });
    }

    // Initial render
    renderWishlist();
  </script>
</body>
</html>
