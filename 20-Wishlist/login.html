<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      margin: 0;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    .navbar .actions {
      display: flex;
      gap: 20px;
    }
    .navbar button, .navbar a {
      color: white;
      background: #3498db;
      text-decoration: none;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .container {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    p {
      text-align: center;
      margin-top: 10px;
    }
    a {
      color: #3498db;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div><a href="index.html">Home</a></div>
    <div class="actions">
      <div class="dropdown">
        <button>Login</button>
        <div class="dropdown-content">
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </div>
      </div>
      <div class="dropdown">
        <button onclick="window.location.href = 'wishlist.html';">&#10084;</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="loginUser()">Login</button>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    function loginUser() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        Toastify({
          text: 'Please fill in all fields',
          backgroundColor: '#e74c3c',
          duration: 3000,
          close: true,
          gravity: 'top',
          position: 'right'
        }).showToast();
        return;
      }

      let users = JSON.parse(localStorage.getItem('users')) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        Toastify({
          text: 'Invalid email or password',
          backgroundColor: '#e74c3c',
          duration: 3000,
          close: true,
          gravity: 'top',
          position: 'right'
        }).showToast();
        return;
      }

      localStorage.setItem('currentUser', JSON.stringify(user));

      Toastify({
        text: 'Login successful!',
        backgroundColor: '#2ecc71',
        duration: 3000,
        close: true,
        gravity: 'top',
        position: 'right'
      }).showToast();

      setTimeout(() => window.location.href = 'index.html', 1000);
    }
  </script>
</body>
</html>
